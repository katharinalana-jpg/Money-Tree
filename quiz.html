<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find your investor profile with Portemonnaie's values & risk quiz — a warm, jargon-free way to discover how you want your money to work." />
  <title>Find your profile — Portemonnaie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="brand/logos/MAIN_logomark_wallet_color.png">

  <link rel="stylesheet" href="styles.css?v=8" />
  <link rel="stylesheet" href="quiz.css?v=6" />
</head>
<body>

  <!-- NAV -->
  <header class="nav" id="nav">
    <a class="nav__brand" href="index.html">
      <img src="brand/logos/MAIN_logomark_wallet_color.png" alt="" class="nav__brand-mark" />
      <span class="nav__brand-text">
        Portemonnaie
        <small>Finance</small>
      </span>
    </a>
    <nav class="nav__links" aria-label="Primary">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="prereg.html#platform" data-i18n="nav.platform">Platform</a>
      <a href="mission.html" data-i18n="nav.mission">Our Mission</a>
      <a class="nav__cta" href="prereg.html#signup" data-i18n="nav.signup">Sign Up</a>
      <div class="nav__lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </nav>
    <button class="nav__toggle" aria-label="Open menu" data-i18n-aria="nav.menu_aria" aria-expanded="false" aria-controls="mobileMenu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__mobile" id="mobileMenu" hidden>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="prereg.html#platform" data-i18n="nav.platform">Platform</a>
      <a href="mission.html" data-i18n="nav.mission">Our Mission</a>
      <a class="nav__cta" href="prereg.html#signup" data-i18n="nav.signup">Sign Up</a>
      <div class="nav__lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </div>
  </header>

  <main class="quiz-main" id="top">
    <!-- progress -->
    <div class="quiz-progress" aria-hidden="false">
      <div class="quiz-progress__track">
        <div class="quiz-progress__bar"></div>
      </div>
      <span class="quiz-progress__label" aria-live="polite"></span>
    </div>

    <!-- the engine renders one screen at a time into here -->
    <div class="quiz-stage">
      <div id="quizStage">
        <noscript>
          <p style="text-align:center;max-width:32rem;margin:3rem auto;color:var(--ink-mute)">
            This quiz needs JavaScript enabled. Please turn it on to find your investor profile.
          </p>
        </noscript>
      </div>
    </div>
  </main>

  <script src="i18n.js?v=13"></script>
  <script src="script.js?v=4"></script>
  <script src="quiz.js?v=4"></script>
</body>
</html>
