<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portemonnaie Finance — No jargon. No gatekeeping. Just smart tools for your money." />
  <title>Portemonnaie Finance — Investing, but make it yours.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="landing-styles.css" />
</head>
<body>

  <!-- NAV -->
  <header class="l-nav">
    <div class="l-container l-nav__inner">
      <a class="l-nav__brand" href="#">
        <img src="img/wallet_mark.png" alt="" class="l-nav__icon" />
        <div class="l-nav__wordmark">
          <span class="l-nav__name">Portemonnaie</span>
          <span class="l-nav__tagline">Finance</span>
        </div>
      </a>
      <nav class="l-nav__links" aria-label="Primary">
        <a href="#">Features</a>
        <a href="#">About</a>
        <a href="#">Resources</a>
        <a href="#">Blog</a>
        <a href="index.html" class="l-btn l-btn--dark">Get Started</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <main>
    <section class="l-hero">
      <div class="l-container l-hero__inner">

        <!-- Left: headline + copy + CTAs -->
        <div class="l-hero__left">
          <h1 class="l-hero__headline">
            Investing,<br>
            but make it<br>
            <!-- Brushstroke wrapper: SVG stroke sits behind the italic text -->
            <span class="l-brush-wrap">
              <span class="l-brush" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" preserveAspectRatio="none">
                  <!-- Thicker organic brushstroke body covering full word height -->
                  <path d="M3,34 C6,21 18,15 40,14 C65,13 100,11 140,12 C180,13 220,11 262,12 C280,13 292,16 297,21 C299,26 299,33 296,38 C293,44 280,47 260,47 C220,48 180,50 140,48 C100,46 65,48 38,46 C16,45 6,43 3,38 Z"
                        fill="#D4EAD8"/>
                  <!-- Inner highlight streak for paint texture -->
                  <path d="M10,30 C24,25 52,24 85,25 C122,26 162,24 198,25 C228,26 258,25 278,27"
                        stroke="#C8E6D2" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                </svg>
              </span>
              <em class="l-hero__accent">yours.</em>
            </span>
          </h1>

          <p class="l-hero__sub">
            No jargon. No gatekeeping.<br>
            Just smart tools for <span class="l-marigold-u">your</span> money.
          </p>

          <div class="l-hero__ctas">
            <a href="index.html" class="l-btn l-btn--dark">Get Started</a>
            <a href="#" class="l-hero__learn">Learn more <span aria-hidden="true">&#8594;</span></a>
          </div>
        </div>

        <!-- Right: card + plant + caveat -->
        <div class="l-hero__right" aria-hidden="true">

          <!-- Cream sticky-note card -->
          <div class="l-hero__card">
            <strong>For women</strong>
            who build<br>
            <em>their future.</em>
          </div>

          <!-- Plant — contents of img/plant_full.svg inlined directly.
               Inline is required for file:// and for feTurbulence filters to render.
               The SVG code below is the exact, unmodified brand kit plant_full.svg. -->
          <div class="l-hero__plant">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid meet">
              <defs>
                <filter id="plant-paint" x="-10%" y="-10%" width="120%" height="120%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
                  <feDisplacementMap in="SourceGraphic" scale="1.6"/>
                </filter>
                <filter id="plant-leaf" x="-10%" y="-10%" width="120%" height="120%">
                  <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/>
                  <feDisplacementMap in="SourceGraphic" scale="1.2"/>
                </filter>
              </defs>
              <g stroke="#3F5A45" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#plant-paint)">
                <path d="M100,200 C 99,170 96,140 92,118"/>
                <path d="M100,200 C 102,175 108,150 118,128"/>
                <path d="M100,200 C 100,180 99,165 99,150"/>
                <path d="M99,150 C 90,142 80,135 72,128"/>
                <path d="M99,150 C 110,140 122,134 132,128"/>
                <path d="M92,118 C 86,108 80,100 75,94"/>
                <path d="M92,118 C 96,108 102,98 108,88"/>
                <path d="M118,128 C 124,118 130,108 136,98"/>
              </g>
              <g fill="#7FB995" filter="url(#plant-leaf)">
                <ellipse cx="73"  cy="90"  rx="11" ry="18" transform="rotate(-30 73 90)"/>
                <ellipse cx="108" cy="84"  rx="11" ry="18" transform="rotate(20 108 84)"/>
                <ellipse cx="138" cy="94"  rx="11" ry="18" transform="rotate(35 138 94)"/>
                <ellipse cx="68"  cy="125" rx="13" ry="20" transform="rotate(-50 68 125)"/>
                <ellipse cx="135" cy="125" rx="13" ry="20" transform="rotate(50 135 125)"/>
                <ellipse cx="78"  cy="155" rx="12" ry="18" transform="rotate(-65 78 155)"/>
                <ellipse cx="124" cy="155" rx="12" ry="18" transform="rotate(65 124 155)"/>
              </g>
              <g stroke="#3F5A45" stroke-width="0.9" fill="none" opacity="0.55" stroke-linecap="round">
                <path d="M73,73 L73,107"/>
                <path d="M108,67 L108,101"/>
                <path d="M138,77 L138,111"/>
                <path d="M68,107 L68,143"/>
                <path d="M135,107 L135,143"/>
                <path d="M78,138 L78,172"/>
                <path d="M124,138 L124,172"/>
              </g>
              <g filter="url(#plant-paint)">
                <path d="M62,195 L138,195 L130,250 Q 100,256 70,250 Z" fill="#A8D5BA"/>
                <path d="M62,195 L138,195 L135,205 Q 100,210 65,205 Z" fill="#7FB995"/>
              </g>
              <path d="M70,250 Q 100,256 130,250 L 128,245 Q 100,250 72,245 Z" fill="#6FAA85" opacity="0.55" filter="url(#plant-paint)"/>
            </svg>
          </div>

          <!--
            Caveat handwriting block.
            Two lines of text follow gentle upward arcs via SVG textPath.
            "your" in the second line has a hand-drawn oval around it.

            Arc math for circle placement:
              Path lp-c2: M8,67 C58,58 138,50 220,46  (≈213px arc length)
              "On " advance in Caveat 19px  ≈ 30px along path
              "your" center                ≈ 30 + 23 = 53px along path
              At t ≈ 0.25 on that bezier   ≈ SVG coords (50, 60)
          -->
          <div class="l-hero__caveat">
            <svg viewBox="0 0 234 82" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- "Learn. Invest. Grow." arc — rises gently right -->
                <path id="lp-c1" d="M0,44 C55,32 130,20 228,12"/>
                <!-- "On your terms." arc -->
                <path id="lp-c2" d="M8,67 C58,58 138,50 220,46"/>
              </defs>

              <text font-family="'Caveat', cursive" font-size="19" font-weight="500" fill="#4A5C52">
                <textPath href="#lp-c1">Learn. Invest. Grow.</textPath>
              </text>

              <text font-family="'Caveat', cursive" font-size="19" font-weight="500" fill="#4A5C52">
                <textPath href="#lp-c2">On your terms.</textPath>
              </text>

              <!-- Hand-drawn oval around "your" — Forest colour, tighter fit -->
              <path d="M39,66 C38,59 40,52 48,49 C56,46 65,47 71,52 C77,57 76,64 71,69 C66,74 57,77 48,75 C40,73 40,70 39,66 Z"
                    fill="none" stroke="#1F3A2E" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

        </div>
      </div>
    </section>
  </main>

</body>
</html>
