<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explorer: ETFs, Aktien und Anleihen mit Kennzahlen aus dem Basisinformationsblatt und Einstufungen des Datenanbieters, gefiltert und sortiert von dir. Portemonnaie." />
  <title>Explorer — Portemonnaie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="brand/logos/MAIN_logomark_wallet_color.png">

  <link rel="stylesheet" href="styles.css?v=28" />
  <link rel="stylesheet" href="explore.css?v=10" />
</head>
<body class="flow-body explore-body">

  <!-- NAV -->
  <header class="nav" id="nav">
    <a class="nav__brand" href="index.html#top">
      <img src="brand/logos/MAIN_logomark_wallet_color.png" alt="" class="nav__brand-mark" />
      <span class="nav__brand-text">
        Portemonnaie
        <small>Finance</small>
      </span>
    </a>
    <nav class="nav__links nav__links--flow" aria-label="Primary">
      <a href="quiz.html" data-i18n="nav.quiz">Quiz</a>
      <a href="explore.html" class="is-active" data-i18n="nav.explore">Explore</a>
      <a href="portfolio.html" data-i18n="nav.portfolio">Portfolio</a>
      <div class="nav__lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </nav>
    <button class="nav__toggle" aria-label="Open menu" data-i18n-aria="nav.menu_aria" aria-expanded="false" aria-controls="mobileMenu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__mobile" id="mobileMenu" hidden>
      <a href="quiz.html" data-i18n="nav.quiz">Quiz</a>
      <a href="explore.html" data-i18n="nav.explore">Explore</a>
      <a href="portfolio.html" data-i18n="nav.portfolio">Portfolio</a>
      <div class="nav__lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </div>
  </header>

  <nav class="pm-progress" id="pmProgress" data-stage="explore" aria-label="Fortschritt"></nav>

  <!-- S9 · Explorer (/explore) -->
  <main class="explore" id="top">
    <div class="explore__grid">

      <!-- LEFT: filter panel (bottom sheet on mobile) -->
      <aside class="filters" id="filters" aria-label="Filter">
        <noscript>This page needs JavaScript enabled.</noscript>
      </aside>

      <!-- MIDDLE: search · sort · product cards -->
      <section class="results" aria-label="Produkte">
        <div class="results__bar">
          <button type="button" class="btn btn--ghost results__filters" id="filtersToggle">Filter</button>
          <div class="searchbar">
            <svg class="searchbar__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="search" id="search" autocomplete="off" />
          </div>
        </div>

        <div class="results__head">
          <h1 class="results__title" id="resultsTitle"></h1>
          <span class="results__count" id="resultsCount" aria-live="polite"></span>
          <div class="results__sort">
            <label for="sort" id="sortLabel"></label>
            <select id="sort"></select>
          </div>
        </div>

        <ul class="cards" id="cards"></ul>
      </section>

      <!-- RIGHT: sticky portfolio panel (sticky bar on mobile) -->
      <aside class="sidebar" id="basketCol" aria-label="Dein Portfolio">
        <button type="button" class="sidebar__bar" id="panelToggle">
          <svg class="donut donut--mini" viewBox="0 0 120 120" aria-hidden="true"><use href="#donut"></use></svg>
          <span id="panelCount"></span>
        </button>
        <div class="basket" id="basket">
          <p class="basket__eyebrow" id="basketEyebrow"></p>
          <h2 class="basket__title" id="basketTitle"></h2>
          <p class="basket__sub" id="basketSub"></p>
          <ul class="basket__list" id="basketList"></ul>
        </div>

        <div class="portfolio" id="portfolio">
          <h2 class="portfolio__title" id="portfolioTitle"></h2>
          <p class="portfolio__progress" id="portfolioProgress"></p>
          <div class="portfolio__chart">
            <svg class="donut" viewBox="0 0 120 120" id="donut" aria-hidden="true"></svg>
            <ul class="portfolio__legend" id="portfolioLegend"></ul>
          </div>
          <p class="portfolio__sum" id="portfolioSum" aria-live="polite"></p>
          <p class="portfolio__feedback" id="portfolioFeedback" aria-live="polite"></p>
          <button type="button" class="btn btn--primary portfolio__cta" id="checkoutBtn"></button>
        </div>
      </aside>

    </div>
  </main>

  <!-- product detail drawer (PRD S9) -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="pmDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <button type="button" class="drawer__close" id="drawerClose">×</button>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>

  <footer class="pm-disclaimer" id="pmDisclaimer"></footer>

  <script src="i18n.js?v=34"></script>
  <script src="locale.js?v=1"></script>
  <script src="script.js?v=8"></script>
  <script src="session.js?v=4"></script>
  <script src="track.js?v=1"></script>
  <script src="derive.js?v=1"></script>
  <script src="progress.js?v=1"></script>
  <script src="glossary.js?v=1"></script>
  <script src="flow-ui.js?v=1"></script>
  <script src="explore.js?v=17"></script>
</body>
</html>
