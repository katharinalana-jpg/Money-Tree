<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dein Portfolio: Zusammensetzung, monatliche Verteilung, Einstufungen des Datenanbieters und deine Ziele. Portemonnaie." />
  <title>Dein Portfolio — Portemonnaie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="brand/logos/MAIN_logomark_wallet_color.png">

  <link rel="stylesheet" href="styles.css?v=28" />
  <link rel="stylesheet" href="explore.css?v=10" />
  <link rel="stylesheet" href="portfolio.css?v=5" />
</head>
<body class="flow-body explore-body portfolio-body">

  <!-- NAV -->
  <header class="nav" id="nav">
    <a class="nav__brand" href="index.html#top">
      <img src="brand/logos/MAIN_logomark_wallet_color.png" alt="" class="nav__brand-mark" />
      <span class="nav__brand-text">
        Portemonnaie
        <small>Finance</small>
      </span>
    </a>
    <nav class="nav__links nav__links--flow" aria-label="Primary">
      <a href="quiz.html" data-i18n="nav.quiz">Quiz</a>
      <a href="explore.html" data-i18n="nav.explore">Explore</a>
      <a href="portfolio.html" class="is-active" data-i18n="nav.portfolio">Portfolio</a>
      <div class="nav__lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </nav>
    <button class="nav__toggle" aria-label="Open menu" data-i18n-aria="nav.menu_aria" aria-expanded="false" aria-controls="mobileMenu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__mobile" id="mobileMenu" hidden>
      <a href="quiz.html" data-i18n="nav.quiz">Quiz</a>
      <a href="explore.html" data-i18n="nav.explore">Explore</a>
      <a href="portfolio.html" data-i18n="nav.portfolio">Portfolio</a>
      <div class="nav__lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </div>
  </header>

  <nav class="pm-progress" id="pmProgress" data-stage="portfolio" aria-label="Fortschritt"></nav>

  <!-- S10 · Dein Portfolio & Plan sichern (/portfolio) -->
  <main class="pf" id="top">
    <h1 class="pf__headline" id="pfHeadline"></h1>

    <div class="pf-empty" id="pfEmpty" hidden></div>

    <div id="pfStage" hidden>
      <div class="pf__stage">
        <!-- LEFT: composition -->
        <section class="pf-card pf-comp" aria-labelledby="compEyebrow">
          <p class="pf-card__eyebrow" id="compEyebrow"></p>
          <div class="pf-row pf-row--head" id="compHead" aria-hidden="true"></div>
          <ul class="pf-comp__list" id="compList"></ul>
          <p class="pf-comp__mix" id="compMix"></p>
          <a class="pf__edit" href="explore.html" data-edit></a>
        </section>

        <!-- CENTER: donut -->
        <div class="pf__col pf__col--center">
          <div class="pf-donut"><svg viewBox="0 0 240 240" id="pfDonut" aria-hidden="true"></svg></div>
          <ul class="portfolio__legend pf-legend" id="pfLegend"></ul>
        </div>

        <!-- RIGHT: goals (the one reserved Forest surface, PRD 5.6) -->
        <section class="pf-card pf-goals" aria-labelledby="goalsEyebrow">
          <p class="pf-card__eyebrow pf-card__eyebrow--light" id="goalsEyebrow"></p>
          <div id="goalsList"></div>
        </section>
      </div>

      <!-- amount + split -->
      <section class="pf-amount" aria-labelledby="amountLabel">
        <label class="pf-amount__label" for="amountInput" id="amountLabel"></label>
        <span class="pf-amount__field"><input type="number" id="amountInput" min="0" step="1" inputmode="numeric" /><span>€</span></span>
        <p class="pf-amount__hint" id="amountHint"></p>
      </section>

      <!-- plan (PDF / e-mail: task 16) -->
      <section class="pf-plan" aria-labelledby="planTitle">
        <h2 class="pf-plan__title" id="planTitle"></h2>
        <div class="pf-plan__actions">
          <button type="button" class="btn btn--primary" id="planPdf" disabled aria-disabled="true"></button>
          <form class="pf-plan__email" id="planForm" novalidate>
            <label class="sr-only" for="planEmailInput" id="planEmailLabel"></label>
            <input type="email" id="planEmailInput" name="email" autocomplete="email" disabled />
            <button type="submit" class="btn btn--primary" id="planEmail" disabled aria-disabled="true"></button>
            <label class="pf-plan__newsletter"><input type="checkbox" id="planNewsletter" name="newsletter" disabled /> <span id="planNewsletterLabel"></span></label>
          </form>
        </div>
        <p class="pf-plan__status" id="planStatus" role="status" aria-live="polite"></p>
      </section>

      <div class="pf-note-wrap" id="pfNote"></div>
    </div>
  </main>

  <footer class="pm-disclaimer" id="pmDisclaimer"></footer>

  <script src="i18n.js?v=34"></script>
  <script src="locale.js?v=1"></script>
  <script src="script.js?v=8"></script>
  <script src="session.js?v=4"></script>
  <script src="track.js?v=1"></script>
  <script src="derive.js?v=1"></script>
  <script src="progress.js?v=1"></script>
  <script src="glossary.js?v=1"></script>
  <script src="flow-ui.js?v=1"></script>
  <script src="plan.js?v=1"></script>
  <script src="portfolio.js?v=10"></script>
</body>
</html>
